<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>File Integrity Monitor</title><desc>Conceptual project workflow, not live telemetry.</desc><style>.packet{animation:travel 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.spin{transform-origin:230px 155px;animation:spin 10s linear infinite}@keyframes travel{0%{transform:translateX(0);opacity:.2}50%{opacity:1}100%{transform:translateX(270px);opacity:.2}}@keyframes pulse{50%{opacity:.2}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.packet,.pulse,.spin{animation:none}}</style><rect width="1000" height="300" rx="18" fill="#080f1d"/><g font-family="monospace"><text x="28" y="40" fill="#7dd3fc" font-size="22">FILE INTEGRITY MONITOR</text><circle cx="230" cy="155" r="76" fill="none" stroke="#274259" stroke-width="10"/><circle class="spin" cx="230" cy="155" r="76" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-dasharray="60 417"/><text x="186" y="162" fill="#5eead4" font-size="17">SHA-256</text><text x="390" y="113" fill="#cbd5e1" font-size="21">BASELINE  →  CURRENT</text><text x="390" y="155" fill="#cbd5e1" font-size="17">added / modified / removed</text><text x="390" y="193" fill="#fbbf24" font-size="17">errors → unresolved absences</text><text x="28" y="280" fill="#8099b5" font-size="12">CONCEPTUAL WORKFLOW / fresh portfolio implementation</text></g></svg>